# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: azure-llm-batch-starter
metadata:
  template: azure-llm-batch-starter@0.2.0
services:
  api:
    project: ./services/orchestrator
    language: python
    host: function
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: ../../scripts/package-functions.ps1
        posix:
          shell: sh
          run: ../../scripts/package-functions.sh
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: python ./scripts/check-network.py
    posix:
      shell: sh
      run: python ./scripts/check-network.py
  postprovision:
    windows:
      shell: pwsh
      run: python ./scripts/export-config.py
    posix:
      shell: sh
      run: python ./scripts/export-config.py
