name: Offline CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,cloud]"
      - run: python -m ruff check src services tests scripts
      - run: python -m mypy src/llm_batch_starter
      - run: python scripts/run-tests.py -q -m "not live and not browser and not emulator"
      - run: python -m build --no-isolation
      - run: python scripts/verify-release.py
      - run: python -m pip_audit --disable-pip --no-deps -r requirements.lock --progress-spinner off
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: reports/
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep --outfile /tmp/batch-template.json
      - run: az bicep build --file infra/v3-model.bicep --outfile /tmp/v3-model-template.json
      - run: az bicep build --file infra/v4-models.bicep --outfile /tmp/v4-models-template.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e ".[dev,cloud]"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python scripts/normalize-browser-report.py
        if: always()
      - run: npm run test:site
      - run: python scripts/normalize-browser-report.py --category site
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: reports/
